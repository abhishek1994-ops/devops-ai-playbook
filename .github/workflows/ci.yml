name: Boutique CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/boutique-microservices/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm          # native arm64, matches the kind nodes on the M5
    permissions:
      contents: read
      packages: write                  # lets GITHUB_TOKEN push to GHCR
    strategy:
      fail-fast: false
      matrix:
        service: [auth, gateway, orders, order-service, product-service, user-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Pick build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "dir=projects/boutique-microservices/frontend" >> "$GITHUB_OUTPUT"
          else
            echo "dir=projects/boutique-microservices/backend/services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.dir }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write                  # lets the bot commit new tags to gitops/
    steps:
      - uses: actions/checkout@v4

      - name: Point manifests at the new image tag
        run: |
          for svc in auth gateway orders order-service product-service user-service; do
            sed -i "s|image: .*/${svc}:.*|image: ${REGISTRY}/${svc}:${IMAGE_TAG}|" gitops/k8s/backend/${svc}.yml
          done
          sed -i "s|image: .*/frontend:.*|image: ${REGISTRY}/frontend:${IMAGE_TAG}|" gitops/k8s/frontend/deployment.yml
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/k8s/
          git diff --cached --quiet || git commit -m "ci: update image tags to ${IMAGE_TAG}"
          git push
